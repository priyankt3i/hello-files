<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; img-src 'self' file: data:; style-src 'unsafe-inline';"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hello Files</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }

      body {
        -webkit-app-region: drag;
        background: #f7f7f5;
        color: #2b2b28;
        font-family: "Inter", "Segoe UI", system-ui, sans-serif;
        position: relative;
      }

      main {
        height: 100%;
        position: relative;
        width: 100%;
      }

      .splash-image {
        display: block;
        height: 100%;
        inset: 0;
        object-fit: cover;
        position: absolute;
        width: 100%;
      }

      .loading {
        align-items: center;
        bottom: 24px;
        display: flex;
        justify-content: center;
        left: 0;
        position: absolute;
        right: 0;
      }

      .progress {
        background: rgba(255, 255, 255, 0.62);
        border: 3px solid #2b2b28;
        height: 30px;
        overflow: hidden;
        position: relative;
        width: min(300px, 68vw);
      }

      .progress-fill {
        animation: progress 1.8s ease-in-out infinite;
        background: #08a9dc;
        bottom: 0;
        left: 0;
        position: absolute;
        top: 0;
        width: 62%;
      }

      .progress-label {
        color: #0f172a;
        font-size: 13px;
        font-weight: 700;
        inset: 0;
        line-height: 24px;
        position: absolute;
        text-align: center;
      }

      @keyframes progress {
        0% {
          transform: translateX(-70%);
        }

        55% {
          transform: translateX(38%);
        }

        100% {
          transform: translateX(112%);
        }
      }
    </style>
  </head>
  <body>
    <main aria-label="Hello Files is loading">
      <img class="splash-image" src="./hello-files-splash.png" alt="Hello Files" />
      <div class="loading">
        <div class="progress" role="status" aria-label="Loading chats">
          <div class="progress-fill" aria-hidden="true"></div>
          <div class="progress-label">Loading Chats...</div>
        </div>
      </div>
    </main>
  </body>
</html>
