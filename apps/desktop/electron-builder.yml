appId: com.hellofiles.desktop
productName: Hello Files
electronVersion: 35.0.1

asar: true
asarUnpack:
  - "**/*.node"

directories:
  output: ../../dist/desktop
  buildResources: build

files:
  - out/**
  - package.json

extraResources:
  - from: build/hello-files-logo.ico
    to: hello-files-logo.ico
  - from: src/renderer/assets
    to: splash
    filter:
      - splash.html
      - hello-files-splash.png
  - from: resources/indexer
    to: indexer
    filter:
      - "**/*"

mac:
  category: public.app-category.developer-tools
  target:
    - dmg
    - zip

win:
  icon: build/hello-files-logo.ico
  target:
    - nsis

linux:
  target:
    - AppImage
    - deb
